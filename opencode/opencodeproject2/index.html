<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AnythingLLM 文档上传</title>
<style>
body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
h1 { font-size: 1.4em; }
#status { margin-top: 16px; padding: 12px; border-radius: 4px; display: none; }
#status.success { display: block; background: #d4edda; color: #155724; }
#status.error { display: block; background: #f8d7da; color: #721c24; }
#status.loading { display: block; background: #fff3cd; color: #856404; }
pre { background: #f5f5f5; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 0.85em; }
</style>
</head>
<body>
<h1>AnythingLLM 文档上传</h1>
<input type="file" id="fileInput">
<button id="uploadBtn" onclick="upload()">上传并嵌入</button>
<div id="status"></div>
<pre id="result" style="display:none"></pre>

<script>
const API_BASE = 'http://localhost:3001/api';
const API_KEY = 'your-api-key-here';

function showStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = type;
  el.style.display = 'block';
}

async function upload() {
  const file = document.getElementById('fileInput').files[0];
  if (!file) { alert('请选择文件'); return; }

  document.getElementById('uploadBtn').disabled = true;
  document.getElementById('result').style.display = 'none';
  showStatus('正在获取工作空间...', 'loading');

  try {
    // 获取工作空间列表
    const wsRes = await fetch(`${API_BASE}/v1/workspaces`, {
      headers: { 'Authorization': `Bearer ${API_KEY}` }
    });
    if (!wsRes.ok) throw new Error(`获取工作空间失败: ${wsRes.status}`);
    const wsData = await wsRes.json();
    const workspaces = wsData.workspaces || [];
    if (workspaces.length === 0) throw new Error('没有可用的工作空间');

    const firstWs = workspaces[0];
    showStatus(`正在上传到工作空间「${firstWs.name}」...`, 'loading');

    // 上传文件
    const formData = new FormData();
    formData.append('file', file);
    formData.append('addToWorkspaces', firstWs.slug);

    const upRes = await fetch(`${API_BASE}/v1/document/upload`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${API_KEY}` },
      body: formData
    });
    const upData = await upRes.json();
    if (!upRes.ok || !upData.success) throw new Error(upData.error || `上传失败: ${upRes.status}`);

    showStatus('上传并嵌入成功！', 'success');
    document.getElementById('result').textContent = JSON.stringify(upData, null, 2);
    document.getElementById('result').style.display = 'block';
  } catch (e) {
    showStatus(e.message, 'error');
  } finally {
    document.getElementById('uploadBtn').disabled = false;
  }
}
</script>
</body>
</html>
